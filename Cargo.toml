[workspace]
resolver = "2"
members = [
    "crates/docprims-core",
    "crates/docprims-text",
    "crates/docprims-ooxml",
    "crates/docprims-cli",
    "ffi/docprims-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/3leaps/docprims"
authors = ["3leaps Architecture Council"]

[workspace.dependencies]
docprims-core = { path = "crates/docprims-core" }
docprims-text = { path = "crates/docprims-text" }
docprims-ooxml = { path = "crates/docprims-ooxml" }

# Fulmen Ecosystem
rsfulmen = { version = "=0.1.2", default-features = false, features = ["foundry-core"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
time = { version = "0.3", features = ["formatting", "serde"] }

# XML parsing (GPL-free)
quick-xml = "0.39"

# ZIP archive handling (GPL-free)
zip = { version = "2", default-features = false, features = ["deflate"] }

# HTML parsing (GPL-free)
scraper = "0.25"

# Markdown parsing (GPL-free)
pulldown-cmark = "0.13"

# Character encoding
encoding_rs = "0.8"

# Observability
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Error handling
thiserror = "2.0"
