# cargo-deny configuration for docprims
# GPL-free document extraction primitives
#
# Run: cargo deny check

# Evaluate the graph for every platform docprims ships artifacts for, so
# target-specific dependencies are checked too.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
]

[advisories]
ignore = []

[licenses]
# All licenses are denied unless explicitly allowed
# Run `cargo deny list` to see what's actually used
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",     # Weak copyleft, acceptable for linking
    "BSL-1.0",     # Boost Software License (ryu)
    "Unlicense",   # Public domain dedication (aho-corasick, memchr)
]
confidence-threshold = 0.8

# Note: encoding_rs is (Apache-2.0 OR MIT) AND BSD-3-Clause
# All three licenses are in our allow list, so no clarification needed.

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

deny = [
    # Deny GPL and LGPL - this is the core mission of docprims
    { name = "poppler-rs" },      # GPL
    { name = "mupdf" },           # AGPL
    { name = "mupdf-sys" },       # AGPL
    { name = "lopdf", version = "<0.30" },  # Older versions had issues

    # TLS: rustls only; no OpenSSL or platform TLS in any graph
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },

    # Minimum parser versions for untrusted input
    { name = "quick-xml", version = "<0.41" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
