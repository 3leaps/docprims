name: TypeScript N-API Prebuilds
on:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
jobs:
  build-linux:
    name: Build Linux prebuilds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.12.0
      - name: Install Rust targets
        shell: bash
        run: |
          set -euo pipefail
          # arm64-gnu built natively on ubuntu-latest-arm64-s (build-linux-arm64 job)
          rustup target add \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl
      - name: Install Node dependencies
        working-directory: bindings/typescript/docprims
        run: npm install
      - name: Build .node files (zig)
        working-directory: bindings/typescript/docprims
        shell: bash
        run: |
          set -euo pipefail
          rm -f docprims.*.node
          mkdir -p prebuilds

          # glibc baseline (2.17) for broad compatibility
          npx napi build --cargo-cwd native --release --platform --js false --strip \
            --target x86_64-unknown-linux-gnu --zig --zig-abi-suffix 2.17
          mv docprims.linux-x64-gnu.node prebuilds/

          npx napi build --cargo-cwd native --release --platform --js false --strip \
            --target x86_64-unknown-linux-musl --zig
          mv docprims.linux-x64-musl.node prebuilds/

          # arm64-gnu built natively on ubuntu-latest-arm64-s (build-linux-arm64 job)

          npx napi build --cargo-cwd native --release --platform --js false --strip \
            --target aarch64-unknown-linux-musl --zig
          mv docprims.linux-arm64-musl.node prebuilds/
      - name: Upload prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: ts-prebuilds-linux
          path: bindings/typescript/docprims/prebuilds/*.node
  build-linux-arm64:
    name: Build Linux arm64 prebuild (native)
    runs-on: ubuntu-latest-arm64-s
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Node dependencies
        working-directory: bindings/typescript/docprims
        run: npm install
      - name: Build .node file
        working-directory: bindings/typescript/docprims
        shell: bash
        run: |
          set -euo pipefail
          rm -f docprims.*.node
          mkdir -p prebuilds
          npx napi build --cargo-cwd native --release --platform --js false --strip
          mv docprims.linux-arm64-gnu.node prebuilds/
      - name: Upload prebuild
        uses: actions/upload-artifact@v4
        with:
          name: ts-prebuilds-linux-arm64-gnu-native
          path: bindings/typescript/docprims/prebuilds/*.node
  build-macos-arm64:
    name: Build macOS arm64 prebuild
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Node dependencies
        working-directory: bindings/typescript/docprims
        run: npm install
      - name: Build .node file
        working-directory: bindings/typescript/docprims
        shell: bash
        run: |
          set -euo pipefail
          rm -f docprims.*.node
          mkdir -p prebuilds
          npx napi build --cargo-cwd native --release --platform --js false --strip
          mv docprims.darwin-arm64.node prebuilds/
      - name: Upload prebuild
        uses: actions/upload-artifact@v4
        with:
          name: ts-prebuilds-darwin-arm64
          path: bindings/typescript/docprims/prebuilds/*.node
  build-windows:
    name: Build Windows x64 prebuild
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Node dependencies
        working-directory: bindings/typescript/docprims
        run: npm install
      - name: Build .node file
        working-directory: bindings/typescript/docprims
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Force docprims.*.node -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path prebuilds | Out-Null
          npx napi build --cargo-cwd native --release --platform --js false --strip
          Move-Item docprims.win32-x64-msvc.node prebuilds/
      - name: Upload prebuild
        uses: actions/upload-artifact@v4
        with:
          name: ts-prebuilds-win32-x64-msvc
          path: bindings/typescript/docprims/prebuilds/*.node
  package:
    name: Package (npm dir)
    runs-on: ubuntu-latest
    needs: [build-linux, build-linux-arm64, build-macos-arm64, build-windows]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Node dependencies
        working-directory: bindings/typescript/docprims
        run: npm install
      - name: Build JS dist (root package)
        working-directory: bindings/typescript/docprims
        run: npm run clean && npm run build && npm run build:native
      - name: Remove local .node from root dist
        working-directory: bindings/typescript/docprims
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/native/docprims.*.node || true
      - name: Download prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: ts-prebuilds-*
          path: downloaded-prebuilds
      - name: Create npm package templates
        working-directory: bindings/typescript/docprims
        shell: bash
        run: |
          set -euo pipefail
          rm -rf npm
          npx napi create-npm-dir -t .
      - name: Remove unsupported platform packages
        working-directory: bindings/typescript/docprims
        shell: bash
        run: |
          set -euo pipefail
          # darwin-x64 (Intel Mac) is not supported
          # win32-arm64 is not supported (no Go bindings either)
          rm -rf npm/darwin-x64 npm/win32-arm64-msvc
          echo "Removed unsupported platforms: darwin-x64, win32-arm64-msvc"
      - name: Stage .node files into npm packages
        working-directory: bindings/typescript/docprims
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          for f in ../../../downloaded-prebuilds/**/*.node; do
            base="$(basename "$f")"
            plat="${base#docprims.}"
            plat="${plat%.node}"
            dest="npm/${plat}/${base}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done
      - name: Upload npm dir
        uses: actions/upload-artifact@v4
        with:
          name: ts-npm-dir
          path: bindings/typescript/docprims/npm
