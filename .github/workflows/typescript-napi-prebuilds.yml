name: TypeScript N-API Prebuilds
on:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-linux:
    name: Build Linux prebuilds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: 1.94.1
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2.2.1
        with:
          version: 0.12.0
      - name: Install Rust targets
        shell: bash
        run: |
          set -euo pipefail
          # arm64-gnu built natively on ubuntu-latest-arm64-s (build-linux-arm64 job)
          rustup target add \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl
      - name: Install cargo-zigbuild (pinned; napi --cross-compile would otherwise fetch latest)
        run: cargo install cargo-zigbuild --locked --version 0.23.4
      - name: Install Node dependencies
        working-directory: bindings/typescript/docprims
        run: npm install
      - name: Build .node files (zig)
        working-directory: bindings/typescript/docprims
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prebuilds
          mkdir -p prebuilds

          # glibc baseline (2.17) for broad compatibility
          npx napi build --manifest-path native/Cargo.toml --release --platform --no-js --strip --output-dir prebuilds \
            --target x86_64-unknown-linux-gnu --use-napi-cross
          test -f prebuilds/docprims.linux-x64-gnu.node

          npx napi build --manifest-path native/Cargo.toml --release --platform --no-js --strip --output-dir prebuilds \
            --target x86_64-unknown-linux-musl --cross-compile
          test -f prebuilds/docprims.linux-x64-musl.node

          # arm64-gnu built natively on ubuntu-latest-arm64-s (build-linux-arm64 job)

          npx napi build --manifest-path native/Cargo.toml --release --platform --no-js --strip --output-dir prebuilds \
            --target aarch64-unknown-linux-musl --cross-compile
          test -f prebuilds/docprims.linux-arm64-musl.node
      - name: Upload prebuilds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ts-prebuilds-linux
          path: bindings/typescript/docprims/prebuilds/*.node
  build-linux-arm64:
    name: Build Linux arm64 prebuild (native)
    runs-on: ubuntu-latest-arm64-s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: 1.94.1
      - name: Install Node dependencies
        working-directory: bindings/typescript/docprims
        run: npm install
      - name: Build .node file
        working-directory: bindings/typescript/docprims
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prebuilds
          mkdir -p prebuilds
          npx napi build --manifest-path native/Cargo.toml --release --platform --no-js --strip --output-dir prebuilds
          test -f prebuilds/docprims.linux-arm64-gnu.node
      - name: Upload prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ts-prebuilds-linux-arm64-gnu-native
          path: bindings/typescript/docprims/prebuilds/*.node
  build-macos-arm64:
    name: Build macOS arm64 prebuild
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: 1.94.1
      - name: Install Node dependencies
        working-directory: bindings/typescript/docprims
        run: npm install
      - name: Build .node file
        working-directory: bindings/typescript/docprims
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prebuilds
          mkdir -p prebuilds
          npx napi build --manifest-path native/Cargo.toml --release --platform --no-js --strip --output-dir prebuilds
          test -f prebuilds/docprims.darwin-arm64.node
      - name: Upload prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ts-prebuilds-darwin-arm64
          path: bindings/typescript/docprims/prebuilds/*.node
  build-windows:
    name: Build Windows x64 prebuild
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: 1.94.1
      - name: Install Node dependencies
        working-directory: bindings/typescript/docprims
        run: npm install
      - name: Build .node file
        working-directory: bindings/typescript/docprims
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force prebuilds -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path prebuilds | Out-Null
          npx napi build --manifest-path native/Cargo.toml --release --platform --no-js --strip --output-dir prebuilds
          $node = 'prebuilds/docprims.win32-x64-msvc.node'
          if (-not (Test-Path $node)) { throw "missing $node" }
      - name: Upload prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ts-prebuilds-win32-x64-msvc
          path: bindings/typescript/docprims/prebuilds/*.node
  package:
    name: Package (npm dir)
    runs-on: ubuntu-latest
    needs: [build-linux, build-linux-arm64, build-macos-arm64, build-windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: 1.94.1
      - name: Install Node dependencies
        working-directory: bindings/typescript/docprims
        run: npm install
      - name: Build JS dist (root package)
        working-directory: bindings/typescript/docprims
        run: npm run clean && npm run build && npm run build:native
      - name: Remove local .node from root dist
        working-directory: bindings/typescript/docprims
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/native/docprims.*.node || true
      - name: Download prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: ts-prebuilds-*
          path: downloaded-prebuilds
      - name: Create npm package templates
        working-directory: bindings/typescript/docprims
        shell: bash
        run: |
          set -euo pipefail
          rm -rf npm
          npx napi create-npm-dirs
      - name: Remove unsupported platform packages
        working-directory: bindings/typescript/docprims
        shell: bash
        run: |
          set -euo pipefail
          # darwin-x64 (Intel Mac) is not supported
          # win32-arm64 is not supported (no Go bindings either)
          rm -rf npm/darwin-x64 npm/win32-arm64-msvc
          echo "Removed unsupported platforms: darwin-x64, win32-arm64-msvc"
      - name: Stage .node files into npm packages
        working-directory: bindings/typescript/docprims
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          for f in ../../../downloaded-prebuilds/**/*.node; do
            base="$(basename "$f")"
            plat="${base#docprims.}"
            plat="${plat%.node}"
            dest="npm/${plat}/${base}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done
      - name: Upload npm dir
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ts-npm-dir
          path: bindings/typescript/docprims/npm
