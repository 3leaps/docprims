name: Validate Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate (e.g. v0.1.0)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-go:
    name: Validate Go Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.22'
      - name: Test Go module is fetchable
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"

          # Go bindings are tagged as bindings/go/docprims/vX.Y.Z
          GO_MODULE="github.com/3leaps/docprims/bindings/go/docprims"
          GO_VERSION="v${VERSION}"

          echo "Testing: go get ${GO_MODULE}@${GO_VERSION}"
          go mod init test-docprims
          go get "${GO_MODULE}@${GO_VERSION}"

          echo "Go binding fetch: OK"
  validate-typescript:
    name: Validate TypeScript Bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: 1.94.1
      - name: Build and test TypeScript bindings
        run: |
          cd bindings/typescript/docprims
          npm install
          npm run test:ci
  validate-typescript-musl:
    name: Validate TypeScript Bindings (Alpine/musl)
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Install build dependencies
        shell: sh
        run: |
          set -eu
          apk add --no-cache bash curl build-base python3 git
      - name: Install Rust (rustup)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.94.1
          . "$HOME/.cargo/env"
          rustc -V
          cargo -V
      - name: Build and test TypeScript bindings
        working-directory: bindings/typescript/docprims
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          npm install
          npm run test:ci
