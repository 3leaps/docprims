name: Release
on:
  push:
    tags: ['v*']
env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"
jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate VERSION matches tag
        id: version
        run: |
          FILE_VERSION=$(cat VERSION)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "VERSION mismatch: file=$FILE_VERSION tag=$TAG_VERSION"
            exit 1
          fi
          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version validated: $FILE_VERSION"
  verify-go-bindings-assets:
    name: Verify Go Binding Assets
    runs-on: ubuntu-latest
    needs: validate-version
    steps:
      - uses: actions/checkout@v4
      - name: Verify Go module contains prebuilt libs
        run: |
          set -euo pipefail

          echo "Verifying Go binding assets are present in this tag commit"

          test -f bindings/go/docprims/go.mod
          test -f bindings/go/docprims/include/docprims.h

          for platform in \
            darwin-arm64 \
            linux-amd64 \
            linux-amd64-musl \
            linux-arm64 \
            linux-arm64-musl \
            windows-amd64
          do
            path="bindings/go/docprims/lib/${platform}/libdocprims_ffi.a"
            if [ ! -f "$path" ]; then
              echo "ERROR: missing $path"
              echo "Release tags MUST point at a commit that includes the prebuilt Go binding libs."
              exit 1
            fi
            if [ ! -s "$path" ]; then
              echo "ERROR: empty $path"
              exit 1
            fi

            # Shared libs live under lib-shared/<platform>/ and are opt-in via the docprims_shared build tag.
            # Note: musl targets are static-only (no shared library).
            case "$platform" in
              *-musl)
                echo "Skipping shared lib check for musl platform: $platform"
                ;;
              darwin-arm64)
                shared_dir="bindings/go/docprims/lib-shared/${platform}"
                test -d "$shared_dir" || { echo "ERROR: missing $shared_dir"; exit 1; }
                test -s "$shared_dir/libdocprims_ffi.dylib" \
                  || { echo "ERROR: missing shared dylib for $platform"; exit 1; }
                ;;
              windows-amd64)
                shared_dir="bindings/go/docprims/lib-shared/${platform}"
                test -d "$shared_dir" || { echo "ERROR: missing $shared_dir"; exit 1; }
                test -s "$shared_dir/docprims_ffi.dll" \
                  || { echo "ERROR: missing shared dll for $platform"; exit 1; }
                test -s "$shared_dir/libdocprims_ffi.dll.a" \
                  || { echo "ERROR: missing import lib for $platform"; exit 1; }
                ;;
              *)
                shared_dir="bindings/go/docprims/lib-shared/${platform}"
                test -d "$shared_dir" || { echo "ERROR: missing $shared_dir"; exit 1; }
                test -s "$shared_dir/libdocprims_ffi.so" || { echo "ERROR: missing shared so for $platform"; exit 1; }
                ;;
            esac
          done

          echo "Go binding assets verified."
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.3.1
      options: --user root
    needs: validate-version
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            glibc: "2.17"
            artifact_suffix: linux-amd64
          - target: x86_64-unknown-linux-musl
            glibc: ""
            artifact_suffix: linux-amd64-musl
          - target: aarch64-unknown-linux-gnu
            glibc: "2.17"
            artifact_suffix: linux-arm64
          - target: aarch64-unknown-linux-musl
            glibc: ""
            artifact_suffix: linux-arm64-musl
    steps:
      - uses: actions/checkout@v4
      - name: Build CLI
        run: |
          if [ -n "${{ matrix.glibc }}" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}.${{ matrix.glibc }} -p docprims-cli
          else
            cargo zigbuild --release --target ${{ matrix.target }} -p docprims-cli
          fi
      - name: Package CLI
        shell: bash
        run: |
          set -euo pipefail

          resolve_target() {
            file="$1"
            candidates=("${{ matrix.target }}")
            if [ -n "${{ matrix.glibc }}" ]; then
              candidates+=("${{ matrix.target }}.${{ matrix.glibc }}")
            fi
            for c in "${candidates[@]}"; do
              if [ -f "target/${c}/release/${file}" ]; then
                echo "$c"
                return 0
              fi
            done
            echo "ERROR: ${file} not found for candidates: ${candidates[*]}" >&2
            find target -maxdepth 4 -path "*/release/${file}" -print || true
            exit 1
          }

          TARGET_DIR="$(resolve_target docprims)"

          mkdir -p dist/cli
          cp "target/${TARGET_DIR}/release/docprims" dist/cli/docprims
          cp LICENSE-MIT LICENSE-APACHE dist/cli/
          VERSION=${{ needs.validate-version.outputs.version }}
          tar -czf docprims-${VERSION}-${{ matrix.artifact_suffix }}.tar.gz -C dist/cli .
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.artifact_suffix }}
          path: docprims-${{ needs.validate-version.outputs.version }}-${{ matrix.artifact_suffix }}.tar.gz
  build-macos:
    name: Build macOS
    runs-on: macos-14
    needs: validate-version
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build CLI
        run: cargo build --release --target aarch64-apple-darwin -p docprims-cli
      - name: Package CLI
        run: |
          mkdir -p dist/cli
          cp target/aarch64-apple-darwin/release/docprims dist/cli/docprims
          cp LICENSE-MIT LICENSE-APACHE dist/cli/
          tar -czf docprims-${{ needs.validate-version.outputs.version }}-darwin-arm64.tar.gz -C dist/cli .
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-darwin-arm64
          path: docprims-${{ needs.validate-version.outputs.version }}-darwin-arm64.tar.gz
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: validate-version
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: Build CLI (GNU target)
        shell: msys2 {0}
        run: cargo build --release --target x86_64-pc-windows-gnu -p docprims-cli
      - name: Package CLI
        shell: bash
        run: |
          mkdir -p dist/cli
          cp target/x86_64-pc-windows-gnu/release/docprims.exe dist/cli/docprims.exe
          cp LICENSE-MIT LICENSE-APACHE dist/cli/
          cd dist/cli && 7z a -tzip ../../docprims-${{ needs.validate-version.outputs.version }}-windows-amd64.zip .
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-windows-amd64
          path: docprims-${{ needs.validate-version.outputs.version }}-windows-amd64.zip
  cbindgen:
    name: Generate C Header
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.3.1
      options: --user root
    needs: validate-version
    steps:
      - uses: actions/checkout@v4
      - name: Generate C header
        run: cbindgen --config cbindgen.toml --crate docprims-ffi --output docprims.h
      - name: Upload header
        uses: actions/upload-artifact@v4
        with:
          name: c-header
          path: docprims.h
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - validate-version
      - verify-go-bindings-assets
      - build-linux
      - build-macos
      - build-windows
      - cbindgen
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all CLI artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: cli-*
          path: release-cli
      - name: Download C header
        uses: actions/download-artifact@v4.1.3
        with:
          name: c-header
          path: release-header
      - name: Organize release files
        run: |
          mkdir -p release

          # CLI archives
          find release-cli -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} release/ \;

          # Header
          mv release-header/docprims.h release/

          # Licenses
          cp LICENSE-MIT LICENSE-APACHE release/

          ls -la release/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: true
          body: |
            ## docprims v${{ needs.validate-version.outputs.version }}

            GPL-free document text extraction primitives for Rust with Go bindings.

            ### Installation

            Download the appropriate archive for your platform and extract.

            ### Verification

            **Note:** This release is unsigned. Signed checksums will be uploaded after manual signing.

            Once signed artifacts are available:
            ```bash
            # Verify checksum signature
            minisign -Vm SHA256SUMS -p docprims-minisign.pub

            # Verify file checksums
            shasum -a 256 -c SHA256SUMS
            ```

            ### Platform Matrix

            | Platform | CLI | Go Bindings |
            |----------|-----|-------------|
            | Linux x64 (glibc 2.17+) | `docprims-*-linux-amd64.tar.gz` | Supported |
            | Linux x64 (musl) | `docprims-*-linux-amd64-musl.tar.gz` | Supported |
            | Linux arm64 (glibc 2.17+) | `docprims-*-linux-arm64.tar.gz` | Supported |
            | Linux arm64 (musl) | `docprims-*-linux-arm64-musl.tar.gz` | Supported |
            | macOS arm64 | `docprims-*-darwin-arm64.tar.gz` | Supported |
            | Windows x64 | `docprims-*-windows-amd64.zip` | Supported |

            ### Go Bindings

            ```bash
            go get github.com/3leaps/docprims/bindings/go/docprims@v${{ needs.validate-version.outputs.version }}
            ```
