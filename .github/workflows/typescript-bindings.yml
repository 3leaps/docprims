name: TypeScript Bindings
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-typescript:
    name: Test TypeScript Bindings
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: 1.94.1
      - name: Install deps and run tests
        run: |
          cd bindings/typescript/docprims
          npm install
          npm run test:ci
  test-typescript-alpine:
    name: Test TypeScript Bindings (Alpine/musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run tests in node:22-alpine
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w "/repo/bindings/typescript/docprims" \
            node:22-alpine \
            sh -lc '
              set -eu
              apk add --no-cache bash curl build-base python3 ca-certificates
              curl -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.94.1
              . "$HOME/.cargo/env"
              npm install
              npm run test:ci
            '
